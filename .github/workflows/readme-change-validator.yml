name: Validasi perubahan README

on:
  pull_request:
    paths:
      - "README.md"
      - "src/README_template.md"
      - "src/**/*.py"

permissions:
  issues: write

jobs:
  check-readme-changes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          README_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -c "README.md" || true)
          TEMPLATE_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -c "src/README_template.md" || true)
          SCRIPT_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -c "src/.*\.py" || true)

          echo "readme_changed=$README_CHANGED" >> $GITHUB_OUTPUT
          echo "template_changed=$TEMPLATE_CHANGED" >> $GITHUB_OUTPUT
          echo "script_changed=$SCRIPT_CHANGED" >> $GITHUB_OUTPUT

      - name: Validasi README
        run: |
          if [ "${{ steps.changed-files.outputs.readme_changed }}" -gt 0 ] && \
             [ "${{ steps.changed-files.outputs.template_changed }}" -eq 0 ] && \
             [ "${{ steps.changed-files.outputs.script_changed }}" -eq 0 ]; then
            echo "Error: README.md diubah tanpa menyentuh template/skrip generator."
            echo "Edit src/README_template.md atau file Python di src/, lalu generate ulang."
            exit 1
          fi

      - name: Komentar PR jika gagal
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ `README.md` diubah langsung tanpa update `src/README_template.md` atau skrip Python di `src/`.\n\nFLA generate README otomatis — edit template/skrip, jangan README mentah.'
            })
