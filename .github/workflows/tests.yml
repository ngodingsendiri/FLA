name: Tests & Lint (FLA)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Lint dengan Ruff
        run: |
          pip install ruff
          ruff check src/ tests/

      - name: Jalankan unit tests (pytest)
        run: pytest tests/ -v --tb=short
