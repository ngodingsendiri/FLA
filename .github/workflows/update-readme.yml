name: Update README (FLA)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      # Auth GCP opsional (isi secret GCP_* di repo Settings jika mau limit Gemini live)
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Generate README
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          HYPERBOLIC_API_KEY: ${{ secrets.HYPERBOLIC_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: python -u src/pull_available_models.py

      - name: Hapus kredensial GCP
        if: always() && steps.auth.outcome == 'success'
        run: rm -f "${{ steps.auth.outputs.credentials_file_path }}"

      - name: Buat Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "chore: perbarui daftar model FLA"
          body: |
            PR otomatis: memperbarui README dengan model/limit terbaru.

            Di-generate oleh `src/pull_available_models.py`.
          branch: update-readme
          base: main
          commit-message: "chore: perbarui daftar model FLA"
