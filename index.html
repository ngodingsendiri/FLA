<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLA - Free LLMs API Dashboard</title>
    <meta name="description" content="Dashboard Interaktif: Temukan dan bandingkan ratusan Model AI gratis dari berbagai provider.">
    <link rel="stylesheet" href="assets/css/kernel.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Toast -->
    <div id="toast-container" class="toast-container"></div>

    <div class="dashboard-wrapper">

        <!-- ── Header ── -->
        <header class="dashboard-header">
            <div class="brand">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    </svg>
                </div>
                <div>
                    <h1>Free LLMs API</h1>
                    <p class="subtitle">Open-source Developer Portal</p>
                </div>
            </div>
            <div class="header-meta">
                <span class="status-pill">
                    <span class="pulse-dot"></span>
                    <span id="generated-at">Syncing...</span>
                </span>
                <a href="api/models.json" target="_blank" class="raw-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    Raw JSON
                </a>
            </div>
        </header>

        <!-- ── Search ── -->
        <div class="search-section">
            <div class="search-box">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Search model name or ID..." autocomplete="off">
                <span id="result-count" class="result-count"></span>
            </div>
            <p class="search-hint">💡 Click on any Model ID to copy it instantly.</p>
        </div>

        <!-- ── Provider Tabs ── -->
        <nav class="tabs-nav" id="tabs-nav">
            <button class="tab-btn active" data-tab="all">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                All
            </button>
            <!-- Tabs get injected here by JS -->
        </nav>

        <!-- ── Content ── -->
        <main class="dashboard-main" id="output-area">
            <div id="loading-spinner" class="loading-state">
                <div class="spinner"></div>
                <p>Loading available models...</p>
            </div>
            <div id="models-container"></div>
        </main>

        <!-- ── Footer ── -->
        <footer class="dashboard-footer">
            <p>&copy; 2026 FLA Project &middot; Open Source.</p>
            <div class="footer-links">
                <a href="https://github.com/ngodingsendiri/FLA" target="_blank" rel="noopener">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                    GitHub
                </a>
                <a href="https://artificialanalysis.ai" target="_blank" rel="noopener">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    Artificial Analysis
                </a>
            </div>
        </footer>
    </div>

    <script src="assets/js/kernel.js"></script>
</body>
</html>
