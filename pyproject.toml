[project]
name = "fla"
version = "0.1.0"
description = "Free LLM API — katalog provider API model AI gratis berbahasa Indonesia"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — ditangani formatter
    "B006",  # mutable default arg — dipakai di safe_fetch secara sengaja
]

[tool.ruff.lint.isort]
known-first-party = ["data", "fetchers", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
